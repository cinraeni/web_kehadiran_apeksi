<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kehadiran Apeksi</title>
    <link rel="stylesheet" href="styles.css?v=13">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h3>Konfirmasi Kehadiran Seminar Rembug Fiskal dalam Rangka Peningkatan Pendapatan Asli Daerah (PAD)</h3>
            <p style="font-size: 1.05rem; font-weight: 500; margin-top: 0.5rem; color: #f1f5f9;">Batam, 26-27 Agustus 2026</p>
        </header>

        <main>
            <form id="attendance-form" class="glass-panel">
                <div class="form-group">
                    <label for="kota">Kota</label>
                    <select id="kota" required
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                        <option value="" disabled selected>Pilih Kota</option>
                        <option value="Sabang">Sabang</option>
                        <option value="Banda Aceh">Banda Aceh</option>
                        <option value="Lhokseumawe">Lhokseumawe</option>
                        <option value="Langsa">Langsa</option>
                        <option value="Subulussalam">Subulussalam</option>
                        <option value="Medan">Medan</option>
                        <option value="Pematangsiantar">Pematangsiantar</option>
                        <option value="Sibolga">Sibolga</option>
                        <option value="Tanjung Balai">Tanjung Balai</option>
                        <option value="Binjai">Binjai</option>
                        <option value="Tebing Tinggi">Tebing Tinggi</option>
                        <option value="Sidempuan">Padang Sidempuan</option>
                        <option value="Sitoli">Gunung Sitoli</option>
                        <option value="Padang">Padang</option>
                        <option value="Solok">Solok</option>
                        <option value="Sawahlunto">Sawahlunto</option>
                        <option value="Padang Panjang">Padang Panjang</option>
                        <option value="Bukittinggi">Bukittinggi</option>
                        <option value="Payakumbuh">Payakumbuh</option>
                        <option value="Pariaman">Pariaman</option>
                        <option value="Pekanbaru">Pekanbaru</option>
                        <option value="Dumai">Dumai</option>
                        <option value="Tanjungpinang">Tanjungpinang</option>
                        <option value="Batam">Batam</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nama-walikota">Nama Wali Kota</label>
                    <input type="text" id="nama-walikota" required placeholder="Nama Lengkap Wali Kota"
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                </div>
                <div class="form-group">
                    <label for="nama-ajudan">Nama Ajudan</label>
                    <input type="text" id="nama-ajudan" required placeholder="Nama Lengkap Ajudan"
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                </div>

                <div class="form-group">
                    <label for="kehadiran-opd">Kehadiran OPD</label>
                    <select id="kehadiran-opd" required
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                        <option value="" disabled selected>Pilih Kehadiran OPD</option>
                        <option value="Asisten">Asisten</option>
                        <option value="BAPENDA">BAPENDA</option>
                        <option value="Dinas Kominfo">Dinas Komunikasi dan Informatika</option>
                        <option value="BPKAD">BPKAD</option>
                        <option value="Kepala Bagian">Kepala Bagian</option>             
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email OPD</label>
                    <input type="email" id="email" required placeholder="Alamat Email OPD"
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                </div>

                <div class="form-group">
                    <label for="nohp">No. HP</label>
                    <input type="tel" id="nohp" required minlength="10" maxlength="15" placeholder="Nomor Handphone"
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; background-color: #ffffff;">
                </div>

                <div class="form-group">
                    <label for="tanggal">Pilih Tanggal Kehadiran</label>
                    <input type="text" id="tanggal" name="tanggal" required placeholder="dd/mm/yyyy"
                        style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border); font-family: inherit; margin-top: 0.5rem; background-color: #ffffff; color: var(--text-main); cursor: text;">
                </div>



                <div class="form-group">
                    <label>Tanda Tangan</label>
                    <div class="signature-wrapper"
                        style="border: 2px dashed var(--glass-border); border-radius: 8px; background: #ffffff; padding: 0.5rem; text-align: center;">
                        <canvas id="signature-pad" width="400" height="150"
                            style="width: 100%; max-width: 400px; touch-action: none; cursor: crosshair;"></canvas>
                    </div>
                    <button type="button" id="btn-clear-signature" class="secondary-btn"
                        style="width: 100%; margin-top: 0.5rem; padding: 0.5rem; font-size: 0.9rem;">Hapus Tanda
                        Tangan</button>
                </div>

                <div class="form-actions" style="display: flex; gap: 1rem;">
                    <button type="button" id="btn-kirim" class="primary-btn" style="flex: 1;">Konfirmasi</button>
                </div>
            </form>

        </main>
    </div>

    <div class="watermark">&copy; 2026 Cindy Anggraeni, Politeknik Negeri Batam &mdash; All rights reserved.</div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            flatpickr("#tanggal", {
                dateFormat: "Y-m-d",
                altInput: true,
                altFormat: "d/m/Y",
                minDate: "2026-08-25",
                maxDate: "2026-08-27",
                defaultDate: "2026-08-26",
                disableMobile: true
            });
        });
    </script>
    <script type="module" src="script.js?v=8"></script>
</body>

</html>
